spring.application.name=interview-ai-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/interview_ai?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Nitish@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
interviewai.app.jwtSecret=secretKey4InterviewAIApplicationProductionReady2026!
interviewai.app.jwtExpirationMs=86400000

# OpenAI API
openai.api.key=${OPENAI_API_KEY:your_default_key_here}

# Server
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.interviewai.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
