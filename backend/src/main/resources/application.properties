spring.application.name=interview-ai-backend

# =========================
# DATABASE CONFIGURATION (NEON POSTGRESQL)
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# JWT CONFIGURATION
# =========================
interviewai.app.jwtSecret=${JWT_SECRET:secretKey4InterviewAIApplicationProductionReady2026!}
interviewai.app.jwtExpirationMs=86400000

# =========================
# OPENAI API
# =========================
openai.api.key=${OPENAI_API_KEY:dummy}

# =========================
# SERVER
# =========================
server.port=${PORT:8080}

# =========================
# LOGGING
# =========================
logging.level.org.springframework.web=INFO
logging.level.com.interviewai.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE