spring.application.name=interview-ai-backend

# =========================
# DATABASE CONFIGURATION
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interview_ai?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Nitish@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT CONFIGURATION
# =========================
interviewai.app.jwtSecret=${JWT_SECRET:secretKey4InterviewAIApplicationProductionReady2026!}
interviewai.app.jwtExpirationMs=86400000

# =========================
# OPENAI API
# =========================
openai.api.key=${OPENAI_API_KEY}

# =========================
# SERVER
# =========================
server.port=${PORT:8080}

# =========================
# LOGGING
# =========================
logging.level.org.springframework.web=INFO
logging.level.com.interviewai.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE